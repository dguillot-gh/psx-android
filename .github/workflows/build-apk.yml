# "Build APK" button: Actions > Build APK > Run workflow. Runs on the build PC (self-hosted runner, label
# psx-build; set up with tools\setup-runner.ps1, see RUNNER.md), never on GitHub's own machines: the discs
# and the game code stay on that PC. The APKs land in a private Release of this repository.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to build
        type: choice
        default: gex_recomp
        options:
          - all
          - atvracers_recomp
          - crash2_recomp
          - crash3_recomp
          - einhander_recomp
          - ff7_recomp
          - gex_recomp
          - gex2_recomp
          - gex3_recomp
          - gt2sim_recomp
          - legoisland2_recomp
          - parasite_eve_recomp
          - parasite_eve2_recomp
          - persona_recomp
          - persona2_recomp
          - policenauts_recomp
          - tomba_recomp
          - tomba2_recomp
      speed:
        description: Speed pre-compile (faster game; hours per game, best overnight)
        type: boolean
        default: false
      speed_minutes:
        description: Speed pre-compile time limit per game, minutes (0 = 45; unfinished parts resume next time)
        type: number
        default: 0
      clean:
        description: Free disk space afterwards (delete the game's build folder; next build starts from scratch)
        type: boolean
        default: true

permissions:
  contents: write          # create the Release

concurrency:
  group: psx-build         # one build at a time on the build PC
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, psx-build]
    timeout-minutes: 2880  # 2 days: "all" with the speed pre-compile on a small PC
    steps:
      - name: Signing key
        shell: powershell
        env:
          KEYSTORE_B64: ${{ secrets.PSX_KEYSTORE_B64 }}
        run: |
          if (-not $env:KEYSTORE_B64) { throw "secret PSX_KEYSTORE_B64 is missing (RUNNER.md)" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\psx.keystore", [Convert]::FromBase64String($env:KEYSTORE_B64))

      - name: Update the scripts
        # Here, not in ci-build.ps1: a broken ci-build.ps1 on the build PC is then fixed by the next push.
        shell: powershell
        run: |
          if (-not $env:PSX_ROOT) { throw "PSX_ROOT is not set on the build PC (actions-runner\.env; RUNNER.md)" }
          $minGit = "$env:PSX_ROOT\tools-cache\mingit\cmd"
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) { $env:PATH = "$minGit;$env:PATH" }
          $gh = ("$env:PSX_ROOT\tools-cache\gh\bin\gh.exe").Replace('\', '/')
          $t = "$env:PSX_ROOT\psx-android-tools"
          git -C $t -c credential.helper= -c "credential.helper=!'$gh' auth git-credential" fetch -q origin main
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git -C $t merge -q --ff-only origin/main
          if ($LASTEXITCODE -ne 0) { throw "git merge failed (local changes on the build PC?)" }
          git -C $t log -1 --format="Scripts: %h %s"

      - name: Build
        shell: powershell
        env:
          PSX_KEYSTORE: ${{ runner.temp }}\psx.keystore
          RELEASE_TOKEN: ${{ github.token }}
          GAME: ${{ inputs.game }}
          SPEED: ${{ inputs.speed }}
          SPEED_MINUTES: ${{ inputs.speed_minutes }}
          CLEAN: ${{ inputs.clean }}
        run: |
          $a = @("-NoProfile", "-File", "$env:PSX_ROOT\psx-android-tools\tools\ci-build.ps1", "-Game", $env:GAME, "-Release",
                 "-SpeedMinutes", $env:SPEED_MINUTES)
          if ($env:SPEED -eq "true") { $a += "-Speed" }
          if ($env:CLEAN -eq "true") { $a += "-Clean" }
          & "$env:PSX_ROOT\tools-cache\pwsh\pwsh.exe" @a
          exit $LASTEXITCODE

      - name: Remove the signing key
        if: always()
        shell: powershell
        run: Remove-Item "$env:RUNNER_TEMP\psx.keystore" -Force -ErrorAction SilentlyContinue
