# Policenauts (Japan) (English Patched v1.0) — PSXRecomp game config
# Two-disc title: Disc 1 (boot) + Disc 2 (continuation).
# Boot EXE lives under NAUTS/ on the disc (cdrom:\NAUTS\SLPS_002.15;1).
# Moved into recomps\ on 2026-10-06 from the 2026-10-03 snapshot (game.toml, seeds,
# generated, tools\extract_bin_dpk.py) so RUN-ALL builds it on the shared framework.

[game]
name = "Policenauts"
id = "SLPS-00215"
players = 1
exe = "disc/SLPS_002.15"
discs = [
  "disc/Policenauts (Japan) (Disc 1) [En by Slowbeef v1.0].cue",
  "disc/Policenauts (Japan) (Disc 2) [En by Slowbeef v1.0].cue",
]
disc_serials = ["SLPS-00215", "SLPS-00216"]
disc = "disc/Policenauts (Japan) (Disc 1) [En by Slowbeef v1.0].cue"
load_address = "0x80010000"
entry_pc = "0x800127B4"
text_size = "0x00023800"
stack_base = "0x801FFFF0"

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "Policenauts Recompiled"
memcard_dir = "saves"

[prepare_disc]
out_dir = "disc"
boot_exe = "SLPS_002.15"
known_sizes = [748928544]
known_md5 = ["65977ae8b63042475730e6efb6a5a8a6"]
known_sha1 = ["3aa1fe0f2175dee26f66175de2a1ffe6d385ee95"]

# Port 1 holds the Sony Mouse, not a pad. The Android pad switches to its
# trackpad mode for this (drag = move, tap = left click, two-finger tap = right).
[controller]
mouse = true
